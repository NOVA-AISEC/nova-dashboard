name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test operator workflows
        run: npm run test:operations

      - name: Test API security and persistence
        run: npm run test:api

      - name: Test browser resilience
        run: npm run test:resilience

      - name: Test security OS workflows
        run: npm run test:security-os

      - name: Test account boundaries
        run: npm run test:account-boundary

      - name: Test intelligence engine
        run: npm run test:intelligence

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check shared action tokens
        run: npm run test:action-gradient

      - name: Build
        env:
          VITE_USE_MOCK: true
        run: npm run build
